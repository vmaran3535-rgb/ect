<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>EcoTrack AI</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700&family=Figtree:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: sticky glass header, a full-bleed forest-green hero band with a rotating dot-globe and a live dashboard card, then light panels on an auto-fit grid. */
:root{
  --forest:#0B2A1E; --emerald:#12A36B; --lime:#C8F23A;
  --bg:#F4F7F0; --surface:#FFFFFF; --surface2:#E9F0E4; --fg:#10241A; --muted:#4A6155; --line:#D2DECD;
  --brand:#0B7D52; --brand-fg:#FFFFFF; --link:#0A6F49; --focus:#0B7D52; --hi:#5FA800;
  --band:#0B2A1E; --band2:#12402D; --band-fg:#EAF4EC; --band-muted:#A9C4B4;
  --c-rec:#1D6FD1; --c-reuse:#98570A; --c-org:#2F7A2F; --c-haz:#C23A2B; --c-gen:#5A6762;
  --warn-bg:#FFF3DA; --warn-fg:#7A4700; --danger:#B3261E; --ok:#0B7D52;
  --shadow:0 14px 34px -16px rgba(11,42,30,.35);
  --f-display:'Unbounded',system-ui,sans-serif; --f-body:'Figtree',system-ui,sans-serif; --f-mono:'IBM Plex Mono',ui-monospace,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#08150F; --surface:#0F2118; --surface2:#15291F; --fg:#E6F0E8; --muted:#9DB5A5; --line:#233C2E;
  --brand:#2BD08A; --brand-fg:#04210F; --link:#5BE3A5; --focus:#5BE3A5; --hi:#C8F23A;
  --band:#0A2218; --band2:#10372A;
  --c-rec:#6AB0FF; --c-reuse:#F2B04A; --c-org:#6FD36F; --c-haz:#FF8A7A; --c-gen:#A9B8B1;
  --warn-bg:#3A2A0A; --warn-fg:#F2C676; --danger:#FF8A80; --ok:#2BD08A; --shadow:0 14px 34px -16px rgba(0,0,0,.7); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#08150F; --surface:#0F2118; --surface2:#15291F; --fg:#E6F0E8; --muted:#9DB5A5; --line:#233C2E;
  --brand:#2BD08A; --brand-fg:#04210F; --link:#5BE3A5; --focus:#5BE3A5; --hi:#C8F23A;
  --band:#0A2218; --band2:#10372A;
  --c-rec:#6AB0FF; --c-reuse:#F2B04A; --c-org:#6FD36F; --c-haz:#FF8A7A; --c-gen:#A9B8B1;
  --warn-bg:#3A2A0A; --warn-fg:#F2C676; --danger:#FF8A80; --ok:#2BD08A; --shadow:0 14px 34px -16px rgba(0,0,0,.7); color-scheme:dark}

*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--fg);font:16px/1.55 var(--f-body);-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:70;background:var(--bg)}
h1,h2,h3,h4{margin:0;text-wrap:balance}
h1,h2{font-family:var(--f-display);font-weight:700;letter-spacing:-.02em;line-height:1.12}
h2{font-size:clamp(1.35rem,2.6vw,1.9rem)}
h3{font-size:1.1rem;font-weight:700}
h4{font-size:.78rem;font-family:var(--f-mono);font-weight:500;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:18px 0 6px}
p{margin:0 0 .8em}
a{color:var(--link)}
.muted{color:var(--muted)} .small{font-size:.85rem}
.mono{font-family:var(--f-mono)}
.wrap{max-width:1240px;margin-inline:auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px;border-radius:8px}
.band :focus-visible{outline-color:var(--lime)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.skip{position:absolute;left:-999px;top:8px;background:var(--lime);color:#0B2A1E;padding:8px 14px;border-radius:999px;z-index:90}
.skip:focus{left:16px}

/* header */
.hdr{position:sticky;top:env(safe-area-inset-top,0px);z-index:60;background:var(--bg);border-bottom:1px solid var(--line)}
.hdr .wrap{display:flex;align-items:center;gap:12px;min-height:64px}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--fg);font:700 1rem var(--f-display);letter-spacing:-.02em;flex:none}
.brand i{display:grid;place-items:center;width:34px;height:34px;border-radius:11px;background:var(--forest);color:var(--lime)}
.brand b{color:var(--brand)}
.nav{display:flex;gap:2px;margin-left:auto;flex-wrap:nowrap}
.nav a{display:flex;align-items:center;min-height:40px;padding:0 11px;border-radius:999px;text-decoration:none;color:var(--muted);font-weight:600;font-size:.9rem;white-space:nowrap;transition:background .2s,color .2s}
.nav a:hover{background:var(--surface2);color:var(--fg)}
.nav a[aria-current="page"]{background:var(--forest);color:var(--lime)}
.hdr-r{display:flex;align-items:center;gap:8px;flex:none}
.score-chip{display:flex;align-items:center;gap:8px;min-height:40px;padding:0 14px;border-radius:999px;border:1px solid var(--line);background:var(--surface);text-decoration:none;color:var(--fg);font:500 .8rem var(--f-mono)}
.score-chip b{font-size:.95rem;color:var(--brand)}
.burger{display:none}
.mnav{display:none;border-top:1px solid var(--line);padding-block:10px 14px}
.mnav a{display:flex;align-items:center;gap:10px;min-height:46px;padding:0 12px;border-radius:12px;text-decoration:none;color:var(--fg);font-weight:600}
.mnav a[aria-current="page"]{background:var(--forest);color:var(--lime)}
@media (max-width:1120px){.nav{display:none}.burger{display:inline-grid}.hdr-r{margin-left:auto}.mnav.open{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:2px}}
@media (max-width:420px){.score-chip span{display:none}}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 20px;border-radius:999px;border:1px solid transparent;font:600 .95rem var(--f-body);cursor:pointer;text-decoration:none;transition:transform .2s,box-shadow .2s,background .2s;background:var(--surface);color:var(--fg)}
.btn:hover{transform:translateY(-2px)}
.btn svg{flex:none}
.btn-lime{background:var(--lime);color:#0B2A1E;box-shadow:0 10px 26px -10px rgba(200,242,58,.7)}
.btn-brand{background:var(--brand);color:var(--brand-fg)}
.btn-ghost{background:transparent;border-color:var(--line);color:var(--fg)}
.btn-ghost:hover{background:var(--surface2)}
.btn-light{background:rgba(255,255,255,.1);border-color:rgba(255,255,255,.28);color:#fff;backdrop-filter:blur(8px)}
.btn-light:hover{background:rgba(255,255,255,.18)}
.btn-sm{min-height:36px;padding:0 14px;font-size:.85rem}
.btn-danger{background:transparent;border-color:var(--danger);color:var(--danger)}
.btn[disabled]{opacity:.55;cursor:not-allowed;transform:none}
.icon-btn{display:inline-grid;place-items:center;width:40px;height:40px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--fg);cursor:pointer}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.chip{display:inline-flex;align-items:center;gap:6px;min-height:38px;padding:0 15px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--fg);font:600 .88rem var(--f-body);cursor:pointer;transition:background .2s}
.chip:hover{background:var(--surface2)}
.chip[aria-pressed="true"],.chip[aria-selected="true"]{background:var(--brand);color:var(--brand-fg);border-color:var(--brand)}

/* layout bits */
#view>*{animation:pg .4s ease both}
@keyframes pg{from{opacity:.35;transform:translateY(8px)}to{opacity:1;transform:none}}
.sec{padding-block:48px}
.pagehead{padding-block:40px 8px}
.pagehead p{max-width:62ch;color:var(--muted);font-size:1.05rem;margin-top:10px}
.eyebrow{font:500 .75rem var(--f-mono);letter-spacing:.12em;text-transform:uppercase;color:var(--brand);display:flex;align-items:center;gap:8px;margin-bottom:10px}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(min(100%,270px),1fr))}
.g4{grid-template-columns:repeat(auto-fit,minmax(min(100%,210px),1fr))}
.split{display:grid;gap:20px;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);align-items:start}
@media (max-width:900px){.split{grid-template-columns:minmax(0,1fr)}}
.card{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:22px;min-width:0}
.card.pad0{padding:0;overflow:hidden}
.lift{transition:transform .25s,box-shadow .25s}
.lift:hover{transform:translateY(-4px);box-shadow:var(--shadow)}
.band{background:var(--band);color:var(--band-fg)}
.band .muted{color:var(--band-muted)}
.tag-demo{display:inline-flex;align-items:center;gap:6px;font:500 .72rem var(--f-mono);letter-spacing:.04em;padding:3px 10px;border-radius:999px;border:1px dashed currentColor;color:var(--warn-fg);background:var(--warn-bg)}
.band .tag-demo{background:rgba(255,255,255,.08);color:#F2D58E}
.notice{display:flex;gap:12px;align-items:flex-start;padding:14px 16px;border-radius:14px;background:var(--warn-bg);color:var(--warn-fg);font-size:.92rem}
.notice svg{flex:none;margin-top:2px}
.notice.info{background:var(--surface2);color:var(--fg)}
.warn{display:flex;gap:10px;padding:12px 14px;border-radius:12px;background:var(--warn-bg);color:var(--warn-fg);font-size:.92rem;margin-top:12px}
.warn svg{flex:none;margin-top:2px}
.note{padding:10px 14px;border-radius:12px;background:var(--surface2);font-size:.92rem}
.pill{display:inline-flex;align-items:center;gap:6px;padding:3px 11px;border-radius:999px;font:500 .74rem var(--f-mono);color:var(--c);background:color-mix(in srgb,var(--c) 13%,transparent);border:1px solid color-mix(in srgb,var(--c) 38%,transparent)}
.tags{list-style:none;padding:0;margin:0;display:flex;flex-wrap:wrap;gap:8px}
.tags li{padding:5px 12px;border-radius:999px;background:var(--surface2);font-size:.88rem}
ol,ul{padding-left:1.2em;margin:0 0 .8em}
li{margin-bottom:.35em}
.tile{display:grid;place-items:center;flex:none;border-radius:16px;background:color-mix(in srgb,var(--c) 11%,var(--surface));border:1px solid color-mix(in srgb,var(--c) 28%,transparent)}
.tile svg{width:62%;height:62%;fill:color-mix(in srgb,var(--c) 22%,transparent);stroke:var(--c);stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.ico{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}

/* forms */
label.l{display:block;font-weight:600;font-size:.9rem;margin-bottom:6px}
input,select,textarea{font:inherit;color:var(--fg);background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;min-height:44px;width:100%}
textarea{min-height:110px;resize:vertical}
input[type=checkbox]{width:20px;min-height:20px;height:20px;accent-color:var(--brand)}
input[type=file]{padding:8px}
.field{margin-bottom:14px;min-width:0}
.err{color:var(--danger);font-size:.85rem;margin-top:4px}
.check{display:flex;gap:10px;align-items:flex-start;font-size:.92rem}
.search{position:relative}
.search svg{position:absolute;left:14px;top:40px;color:var(--muted)}
.search input{padding-left:42px}

/* hero */
.hero{position:relative;overflow:hidden;background:radial-gradient(900px 500px at 80% 10%,var(--band2),transparent 60%),var(--band)}
.hero>.wrap{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,.9fr);gap:28px;align-items:center;padding-block:56px 36px}
.hero h1{font-size:clamp(1.9rem,4.1vw,3.1rem);color:#fff}
.hero h1 em{font-style:normal;color:var(--lime)}
.hero p.lead{font-size:1.12rem;color:var(--band-muted);max-width:52ch;margin:18px 0 26px}
.tagline{font:500 .8rem var(--f-mono);letter-spacing:.06em;color:var(--lime);margin-top:22px}
.globe-wrap{position:relative;max-width:520px;width:100%;margin-inline:auto}
.globe-wrap canvas{display:block;width:100%;aspect-ratio:1/1}
.glass{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.18);backdrop-filter:blur(16px);border-radius:20px;padding:16px;color:#fff}
.preview{position:absolute;left:-4%;bottom:2%;width:min(260px,70%)}
.preview .big{font:700 2rem var(--f-display);color:var(--lime);line-height:1}
.statbar{border-top:1px solid rgba(255,255,255,.12)}
.statbar .wrap{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:18px;padding-block:22px 28px}
.stat b{display:block;font:700 clamp(1.4rem,2.6vw,2rem) var(--f-display);color:#fff;letter-spacing:-.02em}
.stat span{font-size:.85rem;color:var(--band-muted)}
@media (max-width:900px){.hero>.wrap{grid-template-columns:minmax(0,1fr);padding-block:36px 24px}.preview{position:relative;left:auto;bottom:auto;width:100%;margin-top:-30px}.globe-wrap{max-width:380px}}

/* feature cards */
.fcard{display:flex;flex-direction:column;gap:10px;text-decoration:none;color:var(--fg)}
.fcard .fi{display:grid;place-items:center;width:46px;height:46px;border-radius:14px;background:var(--forest);color:var(--lime)}
.fcard p{color:var(--muted);margin:0;font-size:.95rem}
.fcard .go{margin-top:auto;display:flex;align-items:center;gap:6px;font-weight:700;color:var(--link);font-size:.9rem}
.steps{counter-reset:s}
.step{position:relative;padding-top:6px}
.step .n{font:700 2.4rem var(--f-display);color:var(--hi);opacity:.9}

/* guide / items */
.icard{display:flex;gap:14px;align-items:center;text-align:left;width:100%;cursor:pointer;font:inherit;color:inherit}
.icard h3{margin-bottom:4px}
.icard p{margin:6px 0 0;font-size:.88rem;color:var(--muted)}
.det-h{display:flex;gap:16px;align-items:center;margin-bottom:6px}
.det h3{font-size:1.3rem;margin-bottom:6px}
.chat{display:flex;flex-direction:column;gap:10px;max-height:300px;overflow:auto;margin-bottom:12px}
.msg{padding:10px 14px;border-radius:16px;max-width:92%;font-size:.95rem}
.msg.u{align-self:flex-end;background:var(--brand);color:var(--brand-fg)}
.msg.a{align-self:flex-start;background:var(--surface2)}

/* scanner */
.drop{display:grid;place-items:center;text-align:center;gap:10px;padding:34px 18px;border:2px dashed var(--line);border-radius:20px;background:var(--surface2);transition:border-color .2s,background .2s}
.drop:focus-within{border-color:var(--brand)}
.drop.over{border-color:var(--brand);background:color-mix(in srgb,var(--brand) 10%,var(--surface2))}
.preview-img{display:block;width:100%;max-height:380px;object-fit:contain;border-radius:16px;background:var(--surface2)}
.spin{width:28px;height:28px;border-radius:50%;border:3px solid var(--line);border-top-color:var(--brand);animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}

/* dashboard */
.kpi b{display:block;font:700 1.9rem var(--f-display);letter-spacing:-.02em}
.kpi span{color:var(--muted);font-size:.88rem}
.chart{width:100%;height:auto;display:block}
.chart .grid{stroke:var(--line);stroke-width:1}
.chart .ax{fill:var(--muted);font:11px var(--f-mono)}
.chart .bar{fill:var(--brand)} .chart .bar-hi{fill:var(--hi)}
.donut-n{font:700 20px var(--f-display);fill:var(--fg);text-anchor:middle}
.legend{list-style:none;padding:0;margin:0;display:grid;gap:6px;font-size:.9rem}
.legend li{display:flex;align-items:center;gap:8px;margin:0}
.legend i{width:12px;height:12px;border-radius:4px;background:var(--c);flex:none}
.legend b{margin-left:auto;font-family:var(--f-mono);font-weight:500}
.ring-t{stroke:var(--line)} .ring-v{stroke:var(--brand);transition:stroke-dashoffset .8s}
.ring-n{font:700 17px var(--f-display);fill:var(--fg);text-anchor:middle}
.badge{display:flex;gap:12px;align-items:center;padding:12px;border-radius:16px;border:1px solid var(--line);background:var(--surface)}
.badge .bi{display:grid;place-items:center;width:44px;height:44px;border-radius:14px;background:var(--forest);color:var(--lime);flex:none}
.badge.off{opacity:.55}.badge.off .bi{background:var(--surface2);color:var(--muted)}
.badge b{display:block;font-size:.95rem}.badge span{font-size:.82rem;color:var(--muted)}
.hist{list-style:none;padding:0;margin:0}
.hist li{display:flex;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line);margin:0}
.hist li:last-child{border:0}
.hist .pts{margin-left:auto;font:500 .9rem var(--f-mono);color:var(--brand);white-space:nowrap}
table{width:100%;border-collapse:collapse;font-size:.92rem}
th,td{text-align:left;padding:9px 10px;border-bottom:1px solid var(--line)}
th{font:500 .72rem var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.tw{overflow-x:auto}
.bar-track{height:10px;border-radius:99px;background:var(--surface2);overflow:hidden}
.bar-fill{height:100%;border-radius:99px;background:var(--brand);transition:width .6s}

/* studio */
.proj-art{position:relative;display:grid;place-items:center;height:150px;background:linear-gradient(135deg,color-mix(in srgb,var(--c) 22%,var(--surface)),color-mix(in srgb,var(--c) 6%,var(--surface)))}
.proj-art svg{width:84px;height:84px;fill:color-mix(in srgb,var(--c) 22%,transparent);stroke:var(--c);stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
.proj-art .fav{position:absolute;top:10px;right:10px}
.proj-body{padding:18px;display:flex;flex-direction:column;gap:10px;flex:1}
.meta{display:flex;flex-wrap:wrap;gap:12px;font:500 .78rem var(--f-mono);color:var(--muted)}
.meta span{display:inline-flex;align-items:center;gap:5px}
.fav[aria-pressed="true"]{color:#E5484D}.fav[aria-pressed="true"] .ico{fill:#E5484D}

/* reporter */
.tl{display:flex;gap:0;margin:12px 0}
.tl div{flex:1;text-align:center;font:500 .7rem var(--f-mono);color:var(--muted);position:relative;padding-top:20px}
.tl div::before{content:"";position:absolute;left:50%;top:0;width:14px;height:14px;margin-left:-7px;border-radius:50%;background:var(--surface2);border:2px solid var(--line)}
.tl div::after{content:"";position:absolute;left:-50%;top:6px;width:100%;height:2px;background:var(--line);z-index:-1}
.tl div:first-child::after{display:none}
.tl .on{color:var(--fg)}.tl .on::before{background:var(--brand);border-color:var(--brand)}.tl .on::after{background:var(--brand)}
.thumb{width:100%;max-height:200px;object-fit:cover;border-radius:12px}
.rank{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:14px;border:1px solid var(--line);background:var(--surface)}
.rank.me{border-color:var(--brand);background:color-mix(in srgb,var(--brand) 9%,var(--surface))}
.rank .no{font:700 1rem var(--f-display);width:32px;color:var(--muted)}
.rank .pt{margin-left:auto;font:500 .95rem var(--f-mono)}
.av{display:grid;place-items:center;width:38px;height:38px;border-radius:50%;background:var(--forest);color:var(--lime);font:700 .8rem var(--f-display);flex:none}

/* footer */
.ftr{margin-top:56px;background:var(--band);color:var(--band-fg)}
.ftr .wrap{display:grid;grid-template-columns:minmax(0,1.4fr) repeat(2,minmax(0,1fr));gap:28px;padding-block:40px}
.ftr a{display:block;color:var(--band-fg);text-decoration:none;padding:5px 0;opacity:.85}
.ftr a:hover{opacity:1;text-decoration:underline}
.ftr h4{color:var(--band-muted);margin-top:0}
.ftr small{display:block;color:var(--band-muted);padding-block:0 28px;border-top:1px solid rgba(255,255,255,.12);padding-top:18px}
@media (max-width:760px){.ftr .wrap{grid-template-columns:minmax(0,1fr)}}

/* dialog + toasts */
dialog{border:1px solid var(--line);border-radius:22px;background:var(--surface);color:var(--fg);width:calc(100vw - 32px);max-width:720px;max-height:calc(100vh - 48px);overflow:auto;padding:0}
dialog::backdrop{background:rgba(4,18,12,.65)}
.dlg-in{padding:24px}
.dlg-x{position:sticky;top:0;float:right;margin:12px 12px 0 0}
.toasts{position:fixed;left:0;right:0;bottom:0;display:flex;flex-direction:column;align-items:center;gap:8px;padding:12px max(16px,env(safe-area-inset-left,0px)) calc(14px + env(safe-area-inset-bottom,0px));pointer-events:none;z-index:100}

const LIFE=new Set(['reuse','report','bonus']);
function addAction({type,key,label,pts,kg=0,cat='gen'}){
  const today=dayKey(Date.now());
  const dk=LIFE.has(type)?type+':'+key:type+':'+key+':'+today;
  if(S.actions.some(a=>a.dk===dk)){toast(LIFE.has(type)?'You already earned points for this.':'Already logged today. This earns points once per day.','warn');return false}
  const used=S.actions.filter(a=>dayKey(a.ts)===today).reduce((s,a)=>s+a.pts,0);
  const left=DAILY_CAP-used;
  if(left<=0){toast('Daily cap of '+DAILY_CAP+' points reached. Come back tomorrow.','warn');return false}
  const p=Math.min(pts,left);
  S.actions.push({id:uid(),ts:Date.now(),type,key,label,pts:p,kg,co2:+(kg*(FACT[cat]??0)).toFixed(3),src:'self',dk});
  save();toast('+'+p+' points saved as self-reported.','ok');return true
}
let _sample=null;
function sampleActions(){if(_sample)return _sample;const r=rng(7),out=[];const lab=['Sorted plastic bottles','Sorted paper','Sorted glass jar','Sorted food scraps','Finished jar lantern','Sorted metal cans','Sorted batteries'];
  for(let d=11;d>=0;d--){if(r()<.25&&d>2)continue;const n=1+(r()*3|0);for(let j=0;j<n;j++){const type=r()<.2?'reuse':'sort';out.push({id:'s'+d+j,ts:dayStart(d)+(9+j*3)*36e5,type,key:'x',label:type==='reuse'?lab[4]:lab[r()*7|0],pts:type==='reuse'?25:10,kg:.05+r()*.3,co2:0,src:'self',sample:true})}}
  out.forEach(a=>a.co2=+(a.kg*1.2).toFixed(3));return _sample=out}
function stats(A){
  const days=[...new Set(A.map(a=>dayKey(a.ts)))].sort();
  let best=0,run=0,prev=null;
  days.forEach(k=>{const t=new Date(k+'T00:00:00').getTime();run=prev!==null&&Math.round((t-prev)/864e5)===1?run+1:1;prev=t;best=Math.max(best,run)});
  let streak=0;const set=new Set(days);let i=set.has(dayKey(dayStart(0)))?0:1;while(set.has(dayKey(dayStart(i)))){streak++;i++}
  const c=t=>A.filter(a=>a.type===t).length;
  const pts=A.reduce((s,a)=>s+a.pts,0);
  return{pts,n:A.length,sort:c('sort'),reuse:c('reuse'),report:c('report'),mission:c('mission'),bonus:c('bonus'),kg:A.reduce((s,a)=>s+a.kg,0),co2:A.reduce((s,a)=>s+a.co2,0),streak,best,verified:A.filter(a=>a.src==='verified').length}
}
const level=pts=>{let i=0;LEVELS.forEach((l,j)=>{if(pts>=l[0])i=j});return{i,name:LEVELS[i][1],next:LEVELS[i+1]||null}};
function series(A,n){const out=[];for(let i=n-1;i>=0;i--){const t=dayStart(i);out.push({l:fmtDate(t),v:A.filter(a=>a.ts>=t&&a.ts<t+864e5).reduce((s,a)=>s+a.pts,0),last:i===0})}return out}

function startGlobe(cv){
  const ctx=cv.getContext('2d');if(!ctx)return;const pts=[],N=2300;
  const land=(la,lo)=>Math.sin(lo*2+1.3)*Math.cos(la*1.6)+Math.sin(lo*4.1-la*2.2)*.5+Math.cos(la*3.4+lo*1.2)*.45>.35;
  for(let i=0;i<N;i++){const y=1-2*(i+.5)/N,r=Math.sqrt(1-y*y),t=i*2.39996,x=Math.cos(t)*r,z=Math.sin(t)*r;pts.push([x,y,z,land(Math.asin(y),Math.atan2(z,x))])}
  let ang=.6,size=0,dpr=1;
  const fit=()=>{const r=cv.getBoundingClientRect();dpr=Math.min(devicePixelRatio||1,2);size=r.width||400;cv.width=size*dpr;cv.height=size*dpr};
  function draw(){
    if(!cv.isConnected)return;ctx.setTransform(dpr,0,0,dpr,0,0);ctx.clearRect(0,0,size,size);
    const R=size*.38,cx=size/2,cy=size/2;
    let g=ctx.createRadialGradient(cx,cy,R*.85,cx,cy,R*1.45);g.addColorStop(0,'rgba(200,242,58,.30)');g.addColorStop(1,'rgba(200,242,58,0)');ctx.fillStyle=g;ctx.beginPath();ctx.arc(cx,cy,R*1.45,0,7);ctx.fill();
    g=ctx.createRadialGradient(cx-R*.3,cy-R*.35,R*.1,cx,cy,R);g.addColorStop(0,'#15583E');g.addColorStop(1,'#05160E');ctx.fillStyle=g;ctx.beginPath();ctx.arc(cx,cy,R,0,7);ctx.fill();
    const ca=Math.cos(ang),sa=Math.sin(ang),ct=Math.cos(.4),st=Math.sin(.4);
    for(const p of pts){const x=p[0]*ca+p[2]*sa,z=-p[0]*sa+p[2]*ca,y2=p[1]*ct-z*st,z2=p[1]*st+z*ct;if(z2<0)continue;const s=.7+z2*1.5;ctx.fillStyle=p[3]?`rgba(200,242,58,${(.4+z2*.6).toFixed(2)})`:`rgba(70,205,150,${(.12+z2*.3).toFixed(2)})`;ctx.fillRect(cx+x*R-s/2,cy-y2*R-s/2,s,s)}
    ang+=.004;if(motionOK())requestAnimationFrame(draw)}
  fit();draw();addEventListener('resize',()=>{if(cv.isConnected){fit();if(!motionOK())draw()}})
}

async function scanFile(inp){
  const f=inp.files&&inp.files[0];if(!f)return;handleScanFile(f);inp.value=''}
async function handleScanFile(f){
  try{
    if(!/^image\//.test(f.type))throw new Error('That file is not an image. Choose a JPG, PNG or WebP photo.');
    if(f.size>8*1024*1024)throw new Error('That photo is over 8 MB. Choose a smaller one.');
    if(ui.scan.url)URL.revokeObjectURL(ui.scan.url);
    ui.scan={stage:'loading',url:URL.createObjectURL(f),name:f.name};refresh();
    const r=await classifyImage(f);
    const hint=ITEMS.find(i=>(f.name||'').toLowerCase().split(/[^a-z]+/).some(w=>w.length>3&&(i.n.toLowerCase().includes(w)||i.tags.split(' ').includes(w))));
    if(r.ok){const m=searchItems(r.label)[0];if(m&&r.confidence>=.6){ui.scan={...ui.scan,stage:'result',pick:m.k,ai:true,conf:r.confidence};return refresh()}ui.scan={...ui.scan,stage:'pick',reason:'unsure',hint:m?m.k:null};return refresh()}
    ui.scan={...ui.scan,stage:'pick',reason:r.reason,hint:hint?hint.k:null};refresh();
  }catch(e){ui.scan={stage:'idle',err:e.message};refresh()}}

  <div><h4>Explore</h4>${NAV.slice(1).map(n=>`<a href="#${n[0]}">${TITLES[n[0]]}</a>`).join('')}</div><div><h4>Account</h4><a href="#profile">Profile and settings</a><a href="#dashboard">Eco Score</a><a href="#home">How it works</a></div></div>
  <div class="wrap"><small>Demo build. Statistics on the home page are illustrative. Data you enter is saved in this browser only. Disposal advice is general, so confirm with your local authority.</small></div>`;
}
const currentRoute=()=>{const h=(location.hash||'#home').slice(1);return V[h]?h:'home'};
function applySettings(){const r=document.documentElement,t=S.settings.theme;if(t==='light'||t==='dark')r.setAttribute('data-theme',t);else r.removeAttribute('data-theme');r.classList.toggle('reduce-motion',S.settings.motion==='reduce')}
function render(scrollTop){const name=currentRoute();document.title=(name==='home'?'EcoTrack AI':TITLES[name]+' · EcoTrack AI');
  buildShell();$('#view').innerHTML=V[name]();if(V[name].after)V[name].after();
  $('#mnav').classList.remove('open');$('#burger').setAttribute('aria-expanded','false');
  if(scrollTop){window.scrollTo(0,0);const h=$('#ph')||$('#view h1');if(h){h.setAttribute('tabindex','-1');h.focus({preventScroll:true})}}}
function refresh(keep){const y=scrollY,a=document.activeElement,sel=a&&a.dataset&&(a.dataset.act||a.dataset.change)?{act:a.dataset.act,k:a.dataset.k,id:a.id}:null,vals={};
  if(a&&a.id&&/^(gq|aq|sd|rl|rd|tn|ts)$/.test(a.id))vals={id:a.id,v:a.value,s:a.selectionStart};
  const keepV=(keep||Object.keys(ui.err).length)?[...$('#view').querySelectorAll('input:not([type=file]),select,textarea')].filter(e=>e.id).map(e=>[e.id,e.type==='checkbox'?e.checked:e.value,e.type==='checkbox']):[];
  render(false);window.scrollTo(0,y);
  keepV.forEach(([id,v,cb])=>{const e=document.getElementById(id);if(e){if(cb)e.checked=v;else e.value=v}});
  if(vals.id){const e=document.getElementById(vals.id);if(e){e.focus();try{e.setSelectionRange(vals.s,vals.s)}catch(_){}}}
  else if(sel){const q=sel.act?`[data-act="${sel.act}"]${sel.k!==undefined?`[data-k="${sel.k}"]`:''}`:null;const e=(q&&$(q))||(sel.id&&document.getElementById(sel.id));if(e)e.focus({preventScroll:true})}}
addEventListener('hashchange',()=>{closeDlg();ui.err={};ui.leave=false;ui.wipe=false;render(true)});

/* ============ actions ============ */
const ACT={
toggleMenu:()=>{const m=$('#mnav'),o=m.classList.toggle('open');$('#burger').setAttribute('aria-expanded',String(o));$('#burger').setAttribute('aria-label',o?'Close menu':'Open menu')},
scrollTo:a=>{const e=document.getElementById(a.dataset.target);if(e)e.scrollIntoView({behavior:motionOK()?'smooth':'auto',block:'start'})},
closeDlg,
guideCat:a=>{ui.guide.cat=a.dataset.k;refresh()},
guideSug:a=>{ui.guide.q=a.dataset.q;refresh()},
openItem:a=>{const it=itemBy(a.dataset.k);if(it)openDlg(detailHTML(it))},
logSort:a=>{const it=itemBy(a.dataset.k);if(!it)return;const ok=addAction({type:'sort',key:it.k,label:'Sorted '+it.n.toLowerCase(),pts:10,kg:it.cat==='gen'?0:it.kg,cat:it.cat});if(ok){closeDlg();refresh()}},
scanReset:()=>{if(ui.scan.url)URL.revokeObjectURL(ui.scan.url);ui.scan={stage:'idle'};refresh()},
scanPick:a=>{ui.scan={...ui.scan,stage:'result',pick:a.dataset.k,ai:false};refresh()},
scanPickNoPhoto:a=>{ui.scan={stage:'result',pick:a.dataset.k,ai:false,url:'',name:'No photo'};refresh()},
scanChange:()=>{ui.scan={...ui.scan,stage:'pick',reason:'not-configured'};refresh()},
dashFilter:a=>{ui.dash.f=a.dataset.k;refresh()},
matToggle:a=>{const m=ui.studio.mats,k=a.dataset.k,i=m.indexOf(k);i<0?m.push(k):m.splice(i,1);refresh()},
projCat:a=>{ui.studio.cat=a.dataset.k;refresh()},
openProj:a=>{const p=PROJECTS.find(x=>x.id===a.dataset.k);if(p)openDlg(projectHTML(p))},
fav:a=>{toggleFav(a.dataset.k);refresh()},
favDlg:a=>{toggleFav(a.dataset.k);const p=PROJECTS.find(x=>x.id===a.dataset.k);openDlg(projectHTML(p));refresh()},
madeIt:a=>{const p=PROJECTS.find(x=>x.id===a.dataset.k);if(addAction({type:'reuse',key:p.id,label:'Made: '+p.t,pts:25,kg:.15,cat:'reuse'})){openDlg(projectHTML(p));refresh()}},
stPhotoClear:()=>{ui.studio.photo=null;refresh()},
joinTeam:a=>{const d=DEMO_TEAMS[+a.dataset.k];S.team={name:d[0],grade:d[1],school:'Riverside School (demo)',role:'Student',demoId:+a.dataset.k};save();toast('Joined a demo team on this device.','ok');refresh()},
leaveAsk:()=>{ui.leave=true;refresh()},leaveNo:()=>{ui.leave=false;refresh()},
leaveYes:()=>{S.team=null;ui.leave=false;save();toast('You left the team.','ok');refresh()},
logMission:a=>{const m=MISSIONS.find(x=>x.id===a.dataset.k);if(!addAction({type:'mission',key:m.id,label:'Mission check-in: '+m.t,pts:5,cat:'gen'}))return;
  if(missionCount(m.id)>=m.n)addAction({type:'bonus',key:weekKeyFor(m.id),label:'Mission complete: '+m.t,pts:20,cat:'gen'});refresh()},
geo:()=>{const r=ui.rep;const loc=$('#rl');if(loc)r.locText=loc.value;
  if(!navigator.geolocation){r.geoMsg='Location is not available here. Type the street or landmark instead.';return refresh(true)}
  r.geoMsg='Asking your device for location…';refresh(true);
  navigator.geolocation.getCurrentPosition(p=>{r.lat=p.coords.latitude;r.lng=p.coords.longitude;r.geoMsg='Location captured. Type a landmark too if you can.';refresh(true)},e=>{r.lat=null;r.lng=null;r.geoMsg=e.code===1?'Location permission was blocked or is unavailable in this view. Type the street or landmark instead.':'Could not get your location. Type the street or landmark instead.';refresh(true)},{timeout:8000,maximumAge:60000})},
rpPhotoClear:()=>{ui.rep.photo=null;refresh(true)},
advance:a=>{const x=S.reports.find(r=>r.ref===a.dataset.k);if(x&&x.status<3){x.status++;save();toast('Demo status updated. This is a simulation.','warn');refresh()}},
delReport:a=>{S.reports=S.reports.filter(r=>r.ref!==a.dataset.k);save();toast('Report deleted from this device.','ok');refresh()},
period:a=>{ui.comm.p=a.dataset.k;refresh()},
joinChal:a=>{const k=a.dataset.k,i=S.joined.indexOf(k);i<0?S.joined.push(k):S.joined.splice(i,1);save();refresh()},
copySummary:a=>copyText(a.dataset.k),
profTab:a=>{ui.prof.tab=a.dataset.k;ui.err={};refresh()},
guest:()=>{S.user=null;save();toast('Browsing as guest.','ok');refresh()},
signout:()=>{S.user=null;save();toast('Signed out. Your data stays on this device.','ok');refresh()},
copyExport:()=>{const {accounts,...rest}=S;copyText(JSON.stringify(rest,null,2))},
wipeAsk:()=>{ui.wipe=true;refresh()},wipeNo:()=>{ui.wipe=false;refresh()},
wipeYes:()=>{S=defaults();ui.wipe=false;try{localStorage.removeItem(KEY)}catch(e){}applySettings();toast('All local data deleted.','ok');refresh()}
};
function toggleFav(id){const i=S.favs.indexOf(id);i<0?S.favs.push(id):S.favs.splice(i,1);save();toast(i<0?'Saved to favourites.':'Removed from favourites.','ok')}

/* ============ auth (local demo, hashed passwords) ============ */
const b64=u=>btoa(String.fromCharCode(...u));const unb64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function hashPw(pw,saltB64){const enc=new TextEncoder(),salt=saltB64?unb64(saltB64):crypto.getRandomValues(new Uint8Array(16));const key=await crypto.subtle.importKey('raw',enc.encode(pw),'PBKDF2',false,['deriveBits']);const bits=await crypto.subtle.deriveBits({name:'PBKDF2',salt,iterations:150000,hash:'SHA-256'},key,256);return{salt:b64(salt),hash:b64(new Uint8Array(bits))}}
const emailOk=e=>/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(e);

const FORMS={
ask:f=>{const i=$('#aq'),q=i.value.trim();if(!q)return;ui.chat.push({r:'u',t:q});i.value='';const r=assistantReply(q);ui.chat.push({r:'a',t:r.text,items:r.items});if(ui.chat.length>20)ui.chat=ui.chat.slice(-20);refresh();const c=$('#chat');if(c)c.scrollTop=c.scrollHeight;const n=$('#aq');if(n)n.focus({preventScroll:true})},
scanDesc:f=>{const q=$('#sd').value.trim(),m=q?searchItems(q):[];if(!m.length){ui.scan.descMsg=q?'No match in the guide. Try a simpler name, or choose the closest item above.':'Type what the item is first.';return refresh()}ui.scan={...ui.scan,stage:'result',pick:m[0].k,ai:false,descMsg:''};refresh()},
team:f=>{const n=$('#tn').value.trim(),s=$('#ts').value.trim(),g=$('#tg').value,r=$('#tr').value,c=$('#tc').checked;ui.err={};
  if(n.length<3)ui.err.tn='Enter a team nickname of at least 3 characters.';else if(unsafeText(n))ui.err.tn='Remove emails, links or phone numbers from the nickname.';
  if(s.length<2)ui.err.ts='Enter the school or club name.';else if(unsafeText(s))ui.err.ts='Remove emails, links or phone numbers from this field.';
  if(!g)ui.err.tg='Select a class.';if(!c)ui.err.tc='Please confirm this before creating a team.';
  if(Object.keys(ui.err).length){refresh();const e=$('[aria-invalid="true"]')||$('.err');if(e)e.focus&&e.focus();return}
  S.team={name:n,school:s,grade:g,role:r};save();toast('Team created on this device.','ok');refresh()},
report:f=>{const r=ui.rep,c=$('#rc').value,d=$('#rd').value.trim(),l=$('#rl').value.trim(),approx=$('#ra').checked;r.locText=l;ui.err={};
  if(!c)ui.err.rc='Choose an issue type.';if(d.length<20)ui.err.rd='Describe the problem in at least 20 characters.';if(l.length<3&&r.lat===null)ui.err.rl='Enter a location or use your device location.';
  if(Object.keys(ui.err).length){refresh();const e=$('[aria-invalid="true"]');if(e)e.focus();return}
  let loc=l;if(r.lat!==null){const p=approx?2:4;loc=(l?l+' · ':'')+r.lat.toFixed(p)+', '+r.lng.toFixed(p)+(approx?' (approximate)':'')}
  const ref='ET-'+new Date().getFullYear()+'-'+Math.random().toString(36).slice(2,8).toUpperCase();
  S.reports.push({ref,ts:Date.now(),cat:c,desc:d,loc,photo:r.photo||null,status:0});
  if(!save()){S.reports.pop();return}
  addAction({type:'report',key:ref,label:'Saved report '+ref,pts:15,cat:'gen'});
  ui.rep={photo:null,lat:null,lng:null,geoMsg:''};toast('Report '+ref+' saved on this device. It has not been sent to any authority.','ok');refresh()},
signup:async f=>{const n=$('#su-n').value.trim(),e=$('#su-e').value.trim().toLowerCase(),p=$('#su-p').value;ui.err={};
  if(n.length<2)ui.err['su-n']='Enter a display name.';else if(unsafeText(n))ui.err['su-n']='Use a nickname without emails, links or phone numbers.';
  if(!emailOk(e))ui.err['su-e']='Enter a valid email address.';if(p.length<8)ui.err['su-p']='Use at least 8 characters.';
  if(!ui.err['su-e']&&S.accounts[e])ui.err['su-e']='An account with this email already exists on this device.';
  if(Object.keys(ui.err).length)return refresh();
  try{const h=await hashPw(p,null);S.accounts[e]={name:n,...h};S.user={name:n,email:e};save();toast('Account created on this device.','ok');refresh()}catch(x){ui.err['su-p']='Secure hashing is not available in this browser view. Continue as a guest instead.';refresh()}},
signin:async f=>{const e=$('#si-e').value.trim().toLowerCase(),p=$('#si-p').value;ui.err={};
  if(!emailOk(e))ui.err['si-e']='Enter a valid email address.';if(!p)ui.err['si-p']='Enter your password.';if(Object.keys(ui.err).length)return refresh();
  const a=S.accounts[e];if(!a){ui.err['si-e']='No account with this email on this device.';return refresh()}
  try{const h=await hashPw(p,a.salt);if(h.hash!==a.hash){ui.err['si-p']='That password is not correct.';return refresh()}S.user={name:a.name,email:e};save();toast('Signed in.','ok');refresh()}catch(x){ui.err['si-p']='Secure hashing is not available in this browser view.';refresh()}}
};
const CHANGE={
scanFile:i=>scanFile(i),
stPhoto:async i=>{const f=i.files[0];if(!f)return;try{const r=await readImage(f,480);ui.studio.photo=r.data;ui.studio.err=''}catch(e){ui.studio.err=e.message}refresh()},
rpPhoto:async i=>{const f=i.files[0];if(!f)return;const l=$('#rl');if(l)ui.rep.locText=l.value;ui.err={};try{const r=await readImage(f,640);ui.rep.photo=r.data}catch(e){ui.err.rp=e.message}refresh(true)}
};
const INPUT={guideQ:i=>{ui.guide.q=i.value;$('#glist').innerHTML=guideList()}};

document.addEventListener('click',e=>{const a=e.target.closest('[data-act]');if(a&&ACT[a.dataset.act]){if(a.tagName==='A'&&a.dataset.act==='scrollTo')e.preventDefault();ACT[a.dataset.act](a,e)}});
document.addEventListener('submit',e=>{const f=e.target.closest('form[data-form]');if(f&&FORMS[f.dataset.form]){e.preventDefault();FORMS[f.dataset.form](f)}});
document.addEventListener('change',e=>{const t=e.target;if(t.dataset.set){const k=t.dataset.set;S.settings[k]=k==='goal'?+t.value:t.value;save();applySettings();toast('Setting saved.','ok');refresh();return}if(t.dataset.change&&CHANGE[t.dataset.change])CHANGE[t.dataset.change](t)});
document.addEventListener('input',e=>{const t=e.target;if(t.dataset.input&&INPUT[t.dataset.input])INPUT[t.dataset.input](t)});
document.addEventListener('dragover',e=>{const d=e.target.closest('[data-drop]');if(d){e.preventDefault();d.classList.add('over')}});
document.addEventListener('dragleave',e=>{const d=e.target.closest('[data-drop]');if(d)d.classList.remove('over')});
document.addEventListener('drop',e=>{const d=e.target.closest('[data-drop]');if(d){e.preventDefault();d.classList.remove('over');const f=e.dataTransfer&&e.dataTransfer.files[0];if(f)handleScanFile(f)}});
$('#dlg').addEventListener('click',e=>{if(e.target===$('#dlg'))closeDlg()});

applySettings();
render(false);
</script>
